<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ป้ายประชาสัมพันธ์มีชีวิต - สำนักงานที่ดิน</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* ปุ่มเริ่มต้นใช้งาน เพื่อปลดล็อกระบบเสียงและกล้อง */
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      background-color: #008c44;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    #ui-overlay {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: none;
    }
    .btn-action {
      background-color: #008c44;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <button id="start-btn" onclick="startAR()">▶ แตะเพื่อเริ่มใช้งาน AR</button>

  <div id="ui-overlay">
    <button class="btn-action" onclick="alert('เอกสารที่ต้องใช้:\n1. โฉนดที่ดิน\n2. บัตรประชาชน\n3. ทะเบียนบ้าน')">
      📄 รายการเอกสารที่ต้องใช้
    </button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./banner-target.mind; autoStart: false;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="mascotVideo" src="./nong_khwandin_intro.mp4" preload="auto" loop muted crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="bannerTarget">
      <a-video src="#mascotVideo" position="0 0 0.1" width="1" height="1.5" rotation="0 0 0"></a-video>
    </a-entity>
  </a-scene>

  <script>
    const bannerTarget = document.querySelector('#bannerTarget');
    const mascotVideo = document.querySelector('#mascotVideo');
    const uiOverlay = document.querySelector('#ui-overlay');
    const startBtn = document.querySelector('#start-btn');

    function startAR() {
      // ซ่อนปุ่มเริ่ม และเปิดระบบ AR
      startBtn.style.display = 'none';
      const sceneEl = document.querySelector('a-scene');
      sceneEl.systems["mindar-image-system"].start();
    }

    bannerTarget.addEventListener("targetFound", () => {
      // เมื่อจับภาพได้ เปิดเสียงวิดีโอและเล่น
      mascotVideo.muted = false;
      mascotVideo.play();
      uiOverlay.style.display = "block";
    });

    bannerTarget.addEventListener("targetLost", () => {
      mascotVideo.pause();
      uiOverlay.style.display = "none";
    });
  </script>
</body>
</html>
